<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 194" role="img" aria-label="Superannuation projection report export thumbnail">
  <defs>
    <style>
      .ui      { font-family: 'Inter','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif; }
      .eyebrow { font-size:9px;  font-weight:700; letter-spacing:1.7px; fill:#7a766e; }
      .title   { font-size:20px; font-weight:800; letter-spacing:-0.4px; fill:#1a1a1a; }
      .mlabel  { font-size:9.5px; font-weight:700; letter-spacing:1.3px; fill:#6a665e; }
      .bignum  { font-size:37px; font-weight:800; letter-spacing:-1.6px; fill:#1a1a1a; }
      .date    { font-size:11px; font-weight:600; fill:#444; }
      .delta   { font-size:12.5px; font-weight:700; fill:#d97706; }
      .chip    { font-size:7px; font-weight:700; letter-spacing:0.4px; }
    </style>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a2a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- warm app background -->
  <rect x="0" y="0" width="344" height="194" fill="#f4f3f0"/>

  <!-- report sheet (with soft shadow) -->
  <rect x="14" y="15" width="320" height="174" rx="3" fill="#000000" opacity="0.08"/>
  <rect x="12" y="11" width="320" height="174" rx="3" fill="#ffffff" stroke="#e2e0db" stroke-width="1"/>

  <!-- ===== header ===== -->
  <text class="ui eyebrow" x="30" y="35">PROJECTION REPORT</text>
  <text class="ui title"   x="30" y="57">Retirement Outlook</text>

  <text class="ui date" x="314" y="44" text-anchor="end">28 Jun 2026</text>
  <!-- export chips (PDF / XLSX) -->
  <rect x="256" y="51" width="25" height="13" rx="2.5" fill="#1a1a1a"/>
  <text class="ui chip" x="268.5" y="60.3" text-anchor="middle" fill="#ffffff">PDF</text>
  <rect x="285" y="51" width="29" height="13" rx="2.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text class="ui chip" x="299.5" y="60.3" text-anchor="middle" fill="#1a1a1a">XLSX</text>

  <!-- header ink rule -->
  <rect x="30" y="71" width="284" height="2.4" fill="#1a1a1a"/>

  <!-- ===== focal metric ===== -->
  <text class="ui mlabel" x="30" y="90">PROJECTED BALANCE</text>
  <text class="ui bignum" x="30" y="127">$1.24M</text>
  <!-- amber what-if uplift -->
  <polygon points="33,135 29,142 37,142" fill="#d97706"/>
  <text class="ui delta" x="41" y="143">+$310K</text>

  <!-- ===== growth chart ===== -->
  <g>
    <!-- compounding bars -->
    <g fill="url(#bar)">
      <rect x="184" y="142.8" width="8" height="9.2"/>
      <rect x="196" y="140.1" width="8" height="11.9"/>
      <rect x="208" y="136.8" width="8" height="15.2"/>
      <rect x="220" y="132.9" width="8" height="19.1"/>
      <rect x="232" y="128.2" width="8" height="23.8"/>
      <rect x="244" y="123.0" width="8" height="29.0"/>
      <rect x="256" y="117.0" width="8" height="35.0"/>
      <rect x="268" y="109.8" width="8" height="42.2"/>
      <rect x="280" y="101.8" width="8" height="50.2"/>
      <rect x="292" y="93.3"  width="8" height="58.7"/>
      <rect x="304" y="86.0"  width="8" height="66.0"/>
    </g>
    <!-- dashed inflation-adjusted line -->
    <polyline fill="none" stroke="#9a968e" stroke-width="1.3" stroke-dasharray="3.5 2.5"
      points="188,146 212,140 236,132 260,122 284,112 308,102"/>
    <!-- amber what-if overlay -->
    <polyline fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
      points="188,140 212,130 236,116 260,98 284,80 308,68"/>
    <circle cx="308" cy="68" r="3" fill="#d97706"/>
    <!-- baseline axis -->
    <line x1="184" y1="152" x2="312" y2="152" stroke="#d4d2cc" stroke-width="1"/>
  </g>

  <!-- ===== footer ===== -->
  <rect x="30" y="162" width="284" height="2" fill="#1a1a1a"/>
  <rect x="30"  y="170" width="150" height="3" rx="1.5" fill="#dad8d2"/>
  <rect x="30"  y="176" width="110" height="3" rx="1.5" fill="#e6e4df"/>
  <rect x="216" y="170" width="98"  height="3" rx="1.5" fill="#dad8d2"/>
  <rect x="244" y="176" width="70"  height="3" rx="1.5" fill="#e6e4df"/>
</svg>
